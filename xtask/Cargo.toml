[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

# The lib target is deliberately named apart from the package. With no hyphen in
# the package name, the default lib and bin names are both `xtask`, so the two
# targets compile to one test binary name and nextest reports their cases
# identically: run 43658418728 could not tell the suites apart and mis-filed two
# bin-only cases under the lib suite after every test had passed. A distinct lib
# name keeps the suites separable; the bin target and the `target/debug/xtask`
# path the workflows invoke are unchanged.
[lib]
name = "xtask_verify"

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zip = { version = "=9.6.0", default-features = false, features = ["deflate"] }
tar = "=0.4.46"
flate2 = "=1.1.11"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

base64 = "=0.23.1"
zeroize = "=1.9.1"

# Real Ed25519 SSHSIG verification for the release archive checks. The stable
# pin keeps the release path off a release candidate; 0.6.7 tracks sha2 0.10,
# so `deny.toml` reports a multiple-versions warning next to the direct
# sha2 = 0.11 pin. Both are allowed, and no xtask code mixes the two lines.
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader"] }

# macOS signing imports the owner identity through Security.framework so that no
# password or private key is passed in a child argument vector. Keychain and
# PKCS#12 APIs are compiled whenever target_os = "macos"; no feature is required.
# The crate is already locked as a transitive TLS dependency; the exact version
# is pinned for direct use.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[lints.rust]
unsafe_code = "deny"
