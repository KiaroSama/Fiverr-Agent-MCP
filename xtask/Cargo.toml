[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zip = { version = "=9.0.2", default-features = false, features = ["deflate"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[lints.rust]
unsafe_code = "forbid"
