[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

base64 = "=0.23.1"
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_code = "deny"
