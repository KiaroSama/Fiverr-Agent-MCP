[profile.default]
test-threads = 2
retries = 0
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "2s" }
global-timeout = "10m"

[profile.ci]
test-threads = 2
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "2s" }
global-timeout = "10m"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
