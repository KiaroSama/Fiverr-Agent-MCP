[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# No ignore here. `rsa` and `crypto-bigint` are in Cargo.lock as unenabled
# optional dependencies of `ssh-key` (pinned =0.6.7, features = ["ed25519",
# "std"]). They appear in no resolved graph even with `all-features = true`,
# because ssh-key's own feature list does not wire `rsa`/`ecdsa` into its
# default set, so cargo-deny detects no advisory for them and an ignore here
# would only produce advisory-not-detected warnings. cargo-audit instead scans
# the lockfile irrespective of features, which is why the two IDs are ignored
# in .cargo/audit.toml with full reasoning.
ignore = []

[licenses]
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0", "MPL-2.0", "OpenSSL"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
