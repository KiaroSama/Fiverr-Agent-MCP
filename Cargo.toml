[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "fiverr-agent-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/KiaroSama/Fiverr-Agent-MCP"
description = "Portable account-controlled Fiverr workspace and fail-closed native MCP"

[features]
default = ["browser"]
browser = ["dep:chromiumoxide"]

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "tokio"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
dunce = "=1.0.5"
fs2 = "=0.4.3"
futures = "=0.3.34"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "socks", "json", "stream"] }
rpassword = "=7.5.4"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "client", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks", "limits"] }
schemars = "=1.2.3"
scraper = { version = "=0.27.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }
tokio-util = { version = "=0.7.20", features = ["codec"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }
chromiumoxide = { version = "=0.9.1", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
tempfile = "=3.27.0"
rcgen = "=0.14.10"
tokio-rustls = "=0.26.6"

[lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
lto = "off"
codegen-units = 2
