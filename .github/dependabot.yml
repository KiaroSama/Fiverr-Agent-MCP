version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /xtask
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
