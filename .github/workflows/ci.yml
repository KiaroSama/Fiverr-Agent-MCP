name: CI
on:
  workflow_dispatch:
    inputs:
      proxy_capacity_only:
        description: Run only the proxy recovery regression before production repair
        type: boolean
        default: false
      http_deadline_only:
        description: 'Run only the retained-response regression before a production repair'
        type: boolean
        default: false
      windows_diagnostics:
        description: Record normal Windows cases plus two finite diagnostic samples
        type: boolean
        default: false
      validation_only:
        description: 'Validate only; false also creates the owner-signed Windows distribution'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  status-start:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Mark exact commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_CONTEXT: ${{ inputs.http_deadline_only && 'CI / focused HTTP deadline' || inputs.proxy_capacity_only && 'CI / focused proxy capacity' || 'CI / native acceptance' }}
        run: |
          if [ '${{ inputs.http_deadline_only && inputs.proxy_capacity_only }}' = true ]; then
            printf '%s' 'Select only one focused workload' >&2
            exit 1
          fi
          if [ '${{ inputs.windows_diagnostics }}' = true ] && [ '${{ inputs.validation_only }}' != true ]; then
            printf '%s' 'Windows timing diagnostics require validation_only=true' >&2
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$SOURCE_SHA" -f state=pending -f context="$STATUS_CONTEXT" -f description='Manual validation is running' -f target_url="$RUN_URL" --silent
          if [ '${{ inputs.http_deadline_only || inputs.proxy_capacity_only }}' != true ]; then
            for context in native-x86_64-pc-windows-msvc native-x86_64-unknown-linux-gnu native-aarch64-apple-darwin native-x86_64-apple-darwin 'security / dependencies'; do
              gh api --method POST "repos/$GH_REPO/statuses/$SOURCE_SHA" -f state=pending -f context="CI / $context" -f description='Actual job is pending' -f target_url="$RUN_URL" --silent
            done
          fi
  http-deadline:
    if: (inputs.http_deadline_only || inputs.proxy_capacity_only) && !(inputs.http_deadline_only && inputs.proxy_capacity_only)
    uses: ./.github/workflows/deep.yml
    with:
      http_deadline_only: ${{ inputs.http_deadline_only }}
      proxy_capacity_only: ${{ inputs.proxy_capacity_only }}
  security:
    if: inputs.http_deadline_only != true && inputs.proxy_capacity_only != true
    uses: ./.github/workflows/security.yml
  native:
    if: inputs.http_deadline_only != true && inputs.proxy_capacity_only != true
    name: native-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: ${{ matrix.os == 'windows-2025' && inputs.validation_only != true && 'windows-signing' || 'native-validation' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind workspace storage and worker ceilings
        run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        env:
          # The Windows wrapper checks USERPROFILE; main.sh writes under HOME.
          USERPROFILE: ${{ env.HOME }}
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Native locked verification and package
        timeout-minutes: 55
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_TARGET: ${{ matrix.target }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask ci-native --target "$NATIVE_TARGET" --sha "$SOURCE_SHA" --validation-only "$VALIDATION_ONLY"
      - name: Record finite Windows diagnostic samples
        if: always() && runner.os == 'Windows' && inputs.windows_diagnostics
        timeout-minutes: 15
        run: target/debug/xtask ci-windows-diagnostics
      - name: Retain Windows diagnostic evidence
        if: always() && runner.os == 'Windows' && inputs.windows_diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-timing-diagnostics
          include-hidden-files: true
          path: |
            .ci-work/windows-diagnostics*
            .ci-work/owner-*/*.bin
            target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Sign and verify the exact Windows package
        if: runner.os == 'Windows' && inputs.validation_only != true
        timeout-minutes: 8
        env:
          FIVERR_WINDOWS_PFX_BASE64: ${{ secrets.FIVERR_WINDOWS_PFX_BASE64 }}
          FIVERR_WINDOWS_PFX_PASSWORD: ${{ secrets.FIVERR_WINDOWS_PFX_PASSWORD }}
          SOURCE_SHA: ${{ github.sha }}
        run: target/debug/xtask sign-package --sha "$SOURCE_SHA"
      - name: Publish verified distribution
        if: runner.os == 'Windows' && inputs.validation_only != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fiverr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish measured validation evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-evidence
          include-hidden-files: true
          path: |
            .ci-work/coverage-summary.json
            .ci-work/coverage.json
            .ci-work/mutation-inventory.json
            .ci-work/mutants/mutants.out/outcomes.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain complete test inventory and JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          path: |
            target/nextest/ci/junit.xml
            .ci-work/test-events.jsonl
            .ci-work/test-inventory.json
            .ci-work/owner-*/*.bin
          if-no-files-found: warn
          retention-days: 7
  status-finish:
    if: always()
    needs: [status-start, http-deadline, security, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      statuses: write
      actions: read
    steps:
      - name: Publish actual aggregate result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_RESULT: ${{ needs.status-start.result }}
          FOCUSED_RESULT: ${{ needs.http-deadline.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          FOCUSED: ${{ inputs.http_deadline_only || inputs.proxy_capacity_only }}
          STATUS_CONTEXT: ${{ inputs.http_deadline_only && 'CI / focused HTTP deadline' || inputs.proxy_capacity_only && 'CI / focused proxy capacity' || 'CI / native acceptance' }}
        run: |
          if [ '${{ inputs.http_deadline_only && inputs.proxy_capacity_only }}' = true ]; then
            printf '%s' 'Select only one focused workload' >&2
            exit 1
          fi
          state=failure
          if [ "$START_RESULT" = success ]; then
            if [ "$FOCUSED" = true ] && [ "$FOCUSED_RESULT" = success ]; then
              state=success
            elif [ "$FOCUSED" != true ] && [ "$NATIVE_RESULT" = success ] && [ "$SECURITY_RESULT" = success ]; then
              state=success
            fi
          fi
          if [ "$FOCUSED" != true ]; then
            gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" --jq '.jobs[] | select((.name | startswith("native-")) or .name == "security / dependencies") | [.name, .conclusion, .html_url] | @tsv' > jobs.tsv
            test "$(wc -l < jobs.tsv)" -eq 5
            while IFS=$'\t' read -r name conclusion url; do
              job_state=failure
              if [ "$conclusion" = success ]; then job_state=success; fi
              gh api --method POST "repos/$GH_REPO/statuses/$SOURCE_SHA" -f state="$job_state" -f context="CI / $name" -f description="Actual job: $conclusion" -f target_url="$url" --silent
            done < jobs.tsv
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$SOURCE_SHA" -f state="$state" -f context="$STATUS_CONTEXT" -f description="Manual validation completed: $state" -f target_url="$RUN_URL" --silent
          test "$state" = success
