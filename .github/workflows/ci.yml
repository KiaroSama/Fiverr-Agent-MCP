name: CI
on:
  push:
    branches: [main, feature/fiverr-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'feature/fiverr-native'
    uses: ./.github/workflows/security.yml
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'feature/fiverr-native'
    name: native-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind workspace storage and worker ceilings
        run: ./scripts/ci-bootstrap.ps1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        env:
          # The Windows wrapper checks USERPROFILE; main.sh writes under HOME.
          USERPROFILE: ${{ env.HOME }}
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Native locked verification and package
        timeout-minutes: 55
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: ./scripts/ci-native.ps1 -Target $env:NATIVE_TARGET -Sha $env:SOURCE_SHA
      - name: Publish verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fiverr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure diagnostics and JUnit
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          path: |
            target/nextest/ci/junit.xml
            .ci-work/owner-*/*.bin
          if-no-files-found: warn
          retention-days: 7
