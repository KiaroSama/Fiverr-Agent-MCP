name: Release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful exact-source native CI run with signed Windows artifact
        required: true
        type: string
      source_sha:
        description: Exact verified default-branch SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      run_id: ${{ steps.gate.outputs.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - run: .ci-work/owner cargo build --locked --package xtask --jobs 2
      - name: Verify exact completed CI identity and native/security jobs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: target/debug/xtask release-verify --run "$RUN_ID" --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-tool
          path: target/debug/xtask
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-tool
          path: .ci-work/tool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: fiverr-*
          path: verified-artifacts
          merge-multiple: false
      - name: Verify artifact checksums and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          chmod +x .ci-work/tool/xtask
          .ci-work/tool/xtask release-publish --sha "$SOURCE_SHA"
