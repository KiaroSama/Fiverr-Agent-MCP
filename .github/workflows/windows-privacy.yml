name: Windows token privacy regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - name: Prepare bounded sandbox tools
        run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
          .ci-work/owner docker pull ubuntu:22.04
          .ci-work/owner cargo build --locked --package xtask --jobs 2
      - name: Qualify actual kernel cleanup denial
        run: target/debug/xtask sandbox-acceptance
      - name: Retain sandbox qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-sandbox-qualification
          include-hidden-files: true
          path: |
            .ci-work/sandbox-acceptance.json
            .ci-work/logs/*.log
            .ci-work/owner-*/*.bin
          if-no-files-found: error
          retention-days: 14
  extension:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Prepare owned browser and tooling
        run: |
          mkdir -p .ci-work/extension-browser
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
          curl --fail --location --proto '=https' --max-time 180 --max-filesize 300000000 'https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.50/linux64/chrome-linux64.zip' -o .ci-work/extension-browser/chrome.zip
          unzip -q .ci-work/extension-browser/chrome.zip -d .ci-work/extension-browser
          printf 'FIVERR_EXTENSION_BROWSER=%s/.ci-work/extension-browser/chrome-linux64/chrome\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          .ci-work/owner cargo build --locked --package xtask --jobs 2
      - name: Run loaded extension acceptance
        run: target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test extension_loaded --profile ci --test-threads 1 --no-tests fail --success-output immediate
      - name: Retain loaded extension result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loaded-extension
          include-hidden-files: true
          path: |
            target/nextest/ci/junit.xml
            .ci-work/logs/*.log
          if-no-files-found: error
          retention-days: 14
  token-privacy:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind owned bootstrap
        run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        env:
          USERPROFILE: ${{ env.HOME }}
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run only current-token regression
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test windows_input_paths --profile ci --test-threads 1 --no-tests fail --success-output immediate -E 'test(private_windows_permissions_follow_token_not_username)'
      - name: Retain exact regression result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-token-privacy
          include-hidden-files: true
          path: |
            target/nextest/ci/junit.xml
            .ci-work/owner-*/*.bin
          if-no-files-found: error
          retention-days: 14
