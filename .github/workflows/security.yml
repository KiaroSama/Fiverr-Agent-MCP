name: Security
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/ci-bootstrap.ps1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Verify installed tool versions and locked dependency policy
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          if ((& cargo-audit --version | Out-String) -notmatch '0\.22\.2') { throw 'cargo-audit version mismatch' }
          if ((& cargo-deny --version | Out-String) -notmatch '0\.20\.2') { throw 'cargo-deny version mismatch' }
          & ./scripts/ci-owned.ps1 -Executable cargo-audit -ArgumentsJson '["audit","--deny","warnings"]' -Directory $env:GITHUB_WORKSPACE -Wall 300 -Idle 120
          if ($LASTEXITCODE -ne 0) { throw 'Dependency advisory audit failed' }
          & ./scripts/ci-owned.ps1 -Executable cargo-deny -ArgumentsJson '["--locked","check","advisories","bans","licenses","sources"]' -Directory $env:GITHUB_WORKSPACE -Wall 300 -Idle 120
          if ($LASTEXITCODE -ne 0) { throw 'Dependency source/license policy failed' }
