name: Security
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Verify installed tool versions and locked dependency policy
        timeout-minutes: 12
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask ci-dependencies
