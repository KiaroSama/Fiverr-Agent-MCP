name: Deep validation
on:
  workflow_dispatch:
    inputs:
      http_deadline_only:
        description: 'Run only the retained-response deadline regression'
        type: boolean
        default: false
  workflow_call:
    inputs:
      http_deadline_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  adversarial-packaging:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/ci-bootstrap.ps1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Run retained-response regression
        if: inputs.http_deadline_only
        run: |
          & ./scripts/ci-owned.ps1 -Executable cargo -ArgumentsJson '["nextest","run","--locked","--package","fiverr-agent-mcp","--lib","--profile","ci","--test-threads","1","--no-tests","fail","-E","test(response_deadline_releases_capacity_before_any_body_poll)"]' -Directory $env:GITHUB_WORKSPACE -Wall 900 -Idle 180
          if ($LASTEXITCODE -ne 0) { throw 'Retained-response deadline regression failed' }
      - name: Run implemented adversarial archive validators
        if: inputs.http_deadline_only != true
        run: |
          & ./scripts/ci-owned.ps1 -Executable cargo -ArgumentsJson '["nextest","run","--locked","--package","xtask","--profile","ci","--test-threads","2","--no-tests","fail","--no-fail-fast"]' -Directory $env:GITHUB_WORKSPACE -Wall 900 -Idle 180
          if ($LASTEXITCODE -ne 0) { throw 'Adversarial validators failed' }
