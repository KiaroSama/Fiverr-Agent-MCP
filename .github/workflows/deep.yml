name: Deep validation
on:
  workflow_dispatch:
    inputs:
      boundary_only:
        description: 'Run Windows environment and capability contracts before repair'
        type: boolean
        default: false
      cli_only:
        description: 'Run only owner-menu, registration and launcher regressions'
        type: boolean
        default: false
      maintenance_only:
        description: 'Run only the all-plan persisted identity and token regressions'
        type: boolean
        default: false
      browser_startup_only:
        type: boolean
        default: false
      proxy_capacity_only:
        type: boolean
        default: false
      http_deadline_only:
        description: 'Run only the retained-response deadline regression'
        type: boolean
        default: false
  workflow_call:
    inputs:
      boundary_only:
        description: 'Run Windows environment and capability contracts before repair'
        type: boolean
        default: false
      cli_only:
        description: 'Run only owner-menu, registration and launcher regressions'
        type: boolean
        default: false
      maintenance_only:
        description: 'Run only the all-plan persisted identity and token regressions'
        type: boolean
        default: false
      browser_startup_only:
        type: boolean
        default: false
      proxy_capacity_only:
        type: boolean
        default: false
      http_deadline_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  adversarial-packaging:
    if: inputs.browser_startup_only != true && inputs.cli_only != true && inputs.boundary_only != true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run proxy recovery regression
        if: inputs.proxy_capacity_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test proxy_capacity --profile ci --test-threads 1 --no-tests fail
      - name: Run retained-response regression
        if: inputs.http_deadline_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --lib --profile ci --test-threads 1 --no-tests fail -E 'test(response_deadline_releases_capacity_before_any_body_poll)'
      - name: Run all-plan maintenance regressions
        if: inputs.maintenance_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test http_token_lifecycle --test persisted_identity --profile ci --test-threads 2 --no-tests fail --no-fail-fast
      - name: Run implemented adversarial archive validators
        if: inputs.http_deadline_only != true && inputs.proxy_capacity_only != true && inputs.maintenance_only != true
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package xtask --profile ci --test-threads 2 --no-tests fail --no-fail-fast

  cli-regressions:
    if: inputs.cli_only || inputs.boundary_only
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind owned bootstrap
        run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        env:
          USERPROFILE: ${{ env.HOME }}
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run environment and capability contracts
        if: inputs.boundary_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          status=0
          if [ "$RUNNER_OS" = Windows ]; then
            target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package xtask --profile ci --test-threads 2 --no-tests fail --no-fail-fast -E 'test(windows_child_environment_honors_case_insensitive_removal)' || status=1
          else
            target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package xtask --profile ci --test-threads 2 --no-tests fail --no-fail-fast -E 'test(release::assets::tests) | test(capability_tests)' || status=1
          fi
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test capability_contract --test workspace_contention --test logging_degradation --profile ci --test-threads 2 --no-tests fail --no-fail-fast --success-output immediate || status=1
          exit "$status"
      - name: Run bounded CLI regressions
        if: inputs.cli_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package xtask --profile ci --test-threads 2 --no-tests fail --no-fail-fast
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test registration_policy --test menu_input_limits --test action_menu --test launcher_root_policy --test package_roundtrip --profile ci --test-threads 2 --no-tests fail --no-fail-fast

  browser-startup:
    if: inputs.browser_startup_only
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind owned storage and process bounds
        run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        env:
          USERPROFILE: ${{ env.HOME }}
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run bounded native browser startup cases
        timeout-minutes: 25
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export FIVERR_FIXTURE_BROWSER='C:/Program Files/Google/Chrome/Application/chrome.exe'
          else
            export FIVERR_FIXTURE_BROWSER='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          fi
          test -f "$FIVERR_FIXTURE_BROWSER"
          .ci-work/owner cargo nextest run --locked --package fiverr-agent-mcp --profile ci --test-threads 2 --no-tests fail --no-fail-fast --success-output immediate -E 'test(native_browser_reads_fixed_fixture_without_exposing_credentials) | test(exact_extension_extractor_rejects_unsafe_or_unknown_account_fixtures)'
      - name: Retain every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-startup-${{ matrix.os }}
          include-hidden-files: true
          path: |
            target/nextest/ci/junit.xml
            .ci-work/owner-*/*.bin
          if-no-files-found: error
          retention-days: 14
