name: Deep validation
on:
  workflow_dispatch:
    inputs:
      proxy_capacity_only:
        type: boolean
        default: false
      http_deadline_only:
        description: 'Run only the retained-response deadline regression'
        type: boolean
        default: false
  workflow_call:
    inputs:
      proxy_capacity_only:
        type: boolean
        default: false
      http_deadline_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  adversarial-packaging:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p .ci-work
          rustc +stable --edition 2024 scripts/ci-bootstrap.rs -o .ci-work/bootstrap
          .ci-work/bootstrap
          rustc +stable --edition 2024 scripts/ci-owner.rs -o .ci-work/owner
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Run proxy recovery regression
        if: inputs.proxy_capacity_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --test proxy_capacity --profile ci --test-threads 1 --no-tests fail
      - name: Run retained-response regression
        if: inputs.http_deadline_only
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package fiverr-agent-mcp --lib --profile ci --test-threads 1 --no-tests fail -E 'test(response_deadline_releases_capacity_before_any_body_poll)'
      - name: Run implemented adversarial archive validators
        if: inputs.http_deadline_only != true && inputs.proxy_capacity_only != true
        run: |
          .ci-work/owner cargo build --locked --package xtask --jobs 2
          target/debug/xtask run --wall 900 --idle 180 -- cargo nextest run --locked --package xtask --profile ci --test-threads 2 --no-tests fail --no-fail-fast
